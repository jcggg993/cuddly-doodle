<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一份工作，还是一次重新选择的机会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #2d3748;
            line-height: 1.7;
            padding: 24px 16px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 12px;
        }
        .header p {
            color: #718096;
            font-size: 15px;
        }
        .question-wrap {
            margin-bottom: 28px;
        }
        .q-title {
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 14px;
        }
        .option-item {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .option-item:hover {
            border-color: #667eea;
            background-color: #f7faff;
        }
        .option-item.selected {
            border-color: #667eea;
            background-color: #edf2ff;
        }
        .tip-text {
            margin-top: 8px;
            font-size: 14px;
            color: #667eea;
            min-height: 20px;
        }
        #submitBtn {
            width: 100%;
            padding: 14px;
            border: none;
            background-color: #667eea;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #submitBtn:disabled {
            background: #b4bfe8;
            cursor: not-allowed;
        }
        #resultBox {
            margin-top: 30px;
            padding: 24px;
            background-color: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .result-content {
            font-size: 15px;
            color: #2d3748;
        }
        .result-content p {
            margin-bottom: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>一份工作，还是一次重新选择的机会</h1>
        <p>共18题｜适合待业、应届生、对当下道路迷茫的人，静下心看清自己的方向</p>
    </div>

    <div id="quizBox">
        <!-- 题目数据 -->
    </div>

    <button id="submitBtn" disabled>查看我的结果</button>

    <div id="resultBox">
        <div class="result-title"></div>
        <div class="result-content"></div>
    </div>

    <div class="footer">
        本测评仅为自我觉察参考，不替代现实重大决策
    </div>
</div>

<script>
const questions = [
    {
        q: "1. 你现在焦虑的根源，更多来自哪一项？",
        opts: [
            {text:"没有收入，生存压力紧迫", tip:"觉察：对你来说，稳定收入是第一优先级，先落地生存，再谈长远理想", score:{A:2,B:0}},
            {text:"做一份不喜欢的工作，一眼望到头", tip:"觉察：你害怕的不是失业，是被消耗、失去自我选择权", score:{A:0,B:2}},
            {text:"身边人都稳定，只有自己掉队，害怕评价", tip:"觉察：你的焦虑很大一部分来自外界比较，而非你内心真实需求", score:{A:1,B:1}}
        ]
    },
    {
        q: "2. 如果现在立刻拿到一份稳定、但是你不算喜欢的工作，你会？",
        opts: [
            {text:"先接住，先上班，后续再慢慢找别的出路", tip:"觉察：你偏向务实，懂得先解决眼前困境，属于落地型", score:{A:2,B:0}},
            {text:"犹豫很久，内心抗拒，不想勉强自己", tip:"觉察：你很难长期忍受内耗的环境，勉强的工作很难坚持", score:{A:0,B:2}},
            {text:"看薪资待遇，如果待遇足够好可以接受", tip:"觉察：你是理性权衡型，利弊优先，喜好其次", score:{A:1,B:1}}
        ]
    },
    {
        q: "3. 你是否愿意为了长期目标，忍受1-2年比较枯燥辛苦的积累期？",
        opts: [
            {text:"很难，我希望尽快看到回报", tip:"觉察：你更适合短期有正向反馈的路径，长线蛰伏会不断消耗你", score:{A:2,B:0}},
            {text:"可以接受，只要我相信这条路值得", tip:"觉察：你有长期定力，适合需要沉淀、厚积薄发的选择", score:{A:0,B:2}},
            {text:"要看目标是什么，不确定就不愿意熬", tip:"觉察：缺少清晰信念时，你很难坚持漫长的等待", score:{A:1,B:1}}
        ]
    },
    {
        q: "4. 当身边人劝你“先随便找个班上着”，你的感受是？",
        opts: [
            {text:"说得对，我也觉得自己不该挑", tip:"觉察：你容易被主流声音裹挟，会压抑自己的偏好去迎合共识", score:{A:2,B:0}},
            {text:"道理我懂，但心里很抵触，不甘心", tip:"觉察：你的自我诉求很强，强行妥协大概率会反复后悔", score:{A:0,B:2}},
            {text:"有道理，但我需要时间想清楚", tip:"觉察：你处于摇摆阶段，两边的声音都在影响你", score:{A:1,B:1}}
        ]
    },
    {
        q: "5. 你对风险的接受程度，更接近？",
        opts: [
            {text:"尽量规避风险，稳定优先，不喜欢变数", tip:"觉察：动荡环境会持续消耗你的精神，稳定环境才是你的安全区", score:{A:2,B:0}},
            {text:"愿意承担可控风险，换取更多可能性", tip:"觉察：你不怕变化，害怕的是一辈子被固定道路困住", score:{A:0,B:2}},
            {text:"风险可以有，但不能影响基础生活保障", tip:"觉察：你是保守冒险派，底线是生存安全", score:{A:1,B:1}}
        ]
    },
    {
        q: "6. 空闲的时候，你更愿意？",
        opts: [
            {text:"投递简历、面试、研究岗位，尽快入职", tip:"觉察：你的行动重心在就业落地，目标是尽快回归职场轨道", score:{A:2,B:0}},
            {text:"学习新东西、考证、探索别的赛道可能性", tip:"觉察：你正在为另一条新道路蓄力，你想要转型", score:{A:0,B:2}},
            {text:"放空休息，调整情绪，暂时不想思考工作", tip:"觉察：你现在精力透支，首要任务是恢复状态", score:{A:1,B:1}}
        ]
    },
    {
        q: "7. 你能不能接受，一份工作只是用来赚钱，并不追求热爱？",
        opts: [
            {text:"完全可以，工作本来就是谋生手段", tip:"觉察：你可以把工作和自我价值分开，不容易被工作内耗", score:{A:2,B:0}},
            {text:"很难，长期做不认可的事会持续抑郁疲惫", tip:"觉察：意义感对你非常重要，无意义的工作对你是酷刑", score:{A:0,B:2}},
            {text:"短期可以，长久不行", tip:"觉察：你可以把它当成过渡方案，不能当成终身归宿", score:{A:1,B:1}}
        ]
    },
    {
        q: "8. 你有没有一个心里向往、但还没敢尝试的方向？",
        opts: [
            {text:"没有，我只想要一份正常稳定的工作", tip:"觉察：你没有强烈的转型诉求，你的诉求是安稳落地", score:{A:2,B:0}},
            {text:"有，并且一直惦记，不甘心放弃", tip:"觉察：这个念头不会自己消失，长期压抑会成为心结", score:{A:0,B:2}},
            {text:"有想法，但不确定是不是自己一时冲动", tip:"觉察：向往是存在的，但是缺少信心和落地路径", score:{A:1,B:1}}
        ]
    },
    {
        q: "9. 如果选择重新换赛道，你最害怕的是？",
        opts: [
            {text:"浪费时间，最后两头落空，更难就业", tip:"觉察：你最恐惧沉没成本，害怕选择带来更坏的结果", score:{A:2,B:0}},
            {text:"我怕我还没开始，就被现实打败", tip:"觉察：恐惧来自自我怀疑，不是方向本身没有机会", score:{A:0,B:2}},
            {text:"家人朋友不理解、不支持我", tip:"觉察：外界评价是你做重大选择很大的阻碍", score:{A:1,B:1}}
        ]
    },
    {
        q: "10. 你的存款、家庭支持，可以支撑你多久不上班？",
        opts: [
            {text:"很短，几个月以内，不能长期待业", tip:"觉察：客观条件限制了你长时间试错，优先考虑过渡方案", score:{A:2,B:0}},
            {text:"一年以上，有缓冲空间慢慢探索", tip:"觉察：你拥有试错的底气，有资本慢慢寻找适合自己的路", score:{A:0,B:2}},
            {text:"勉强撑几个月，压力很大", tip:"觉察：缓冲期有限，试错必须轻量化、低成本", score:{A:1,B:1}}
        ]
    },
    {
        q: "11. 你更容易因为什么坚持一件事？",
        opts: [
            {text:"薪资、福利、稳定保障这些现实回报", tip:"觉察：物质回报是你最强的驱动力", score:{A:2,B:0}},
            {text:"这件事本身带给你的成就感和价值感", tip:"觉察：内在满足才是你长久坚持的燃料", score:{A:0,B:2}},
            {text:"两者都要有，缺一不可", tip:"觉察：你需要现实收益和精神价值平衡", score:{A:1,B:1}}
        ]
    },
    {
        q: "12. 面对一份岗位，你优先看？",
        opts: [
            {text:"稳定性、五险一金、收入、通勤", tip:"觉察：现实条件是你筛选工作的第一标尺", score:{A:2,B:0}},
            {text:"能不能学到东西、未来有没有成长空间", tip:"觉察：你更看重长期成长，愿意牺牲短期待遇", score:{A:0,B:2}},
            {text:"平衡，待遇和成长都要兼顾", tip:"觉察：你不想单方面牺牲任何一项", score:{A:1,B:1}}
        ]
    },
    {
        q: "13. 如果暂时就业，你会持续寻找更好的机会吗？",
        opts: [
            {text:"入职稳定后，大概率就躺平不折腾了", tip:"觉察：一旦落地安稳，你倾向停止探索，接受现状", score:{A:2,B:0}},
            {text:"就算上班，也不会放弃探索别的可能性", tip:"觉察：一份工作很难锁住你，你永远保留选择权", score:{A:0,B:2}},
            {text:"看上班之后累不累，太累就没有精力", tip:"觉察：你的探索动力会被繁重工作消耗", score:{A:1,B:1}}
        ]
    },
    {
        q: "14. 你怎么看待“走弯路”这件事？",
        opts: [
            {text:"尽量避免弯路，能一步到位最好", tip:"觉察：你排斥试错，希望每一步选择都有确定回报", score:{A:2,B:0}},
            {text:"弯路也是体验，就算失败也有收获", tip:"觉察：你接纳不确定性，不怕试错带来的代价", score:{A:0,B:2}},
            {text:"可以走弯路，但代价不能太大", tip:"觉察：有限试错可以接受，毁灭性代价不行", score:{A:1,B:1}}
        ]
    },
    {
        q: "15. 当工作消耗到让你持续内耗抑郁，你会？",
        opts: [
            {text:"硬扛，先保证收入，慢慢熬", tip:"觉察：你优先生存，会压抑情绪换取稳定收入", score:{A:2,B:0}},
            {text:"会果断止损，不愿意长期消耗自己", tip:"觉察：你的身心健康优先级高于一份工作", score:{A:0,B:2}},
            {text:"先忍一段时间，一边上班一边找下家", tip:"觉察：你选择平稳过渡，不裸辞冒险", score:{A:1,B:1}}
        ]
    },
    {
        q: "16. 你做决定，更多是？",
        opts: [
            {text:"理性权衡利弊，优先现实条件", tip:"觉察：你是现实决策者，情绪很少主导你的选择", score:{A:2,B:0}},
            {text:"遵从内心感受，不甘心就不愿意妥协", tip:"觉察：感受是你决策的底层标尺，勉强很难长久", score:{A:0,B:2}},
            {text:"理性和感受拉扯，很难下决断", tip:"觉察：你现在正处在典型的选择内耗里", score:{A:1,B:1}}
        ]
    },
    {
        q: "17. 你认为人生一定要有一份长久稳定的主业吗？",
        opts: [
            {text:"是的，稳定主业是安全感的来源", tip:"觉察：你认同传统的职业路径，稳定是你的刚需", score:{A:2,B:0}},
            {text:"不一定，人生可以有更多灵活的活法", tip:"觉察：你不被传统职业框架束缚，接受多元道路", score:{A:0,B:2}},
            {text:"最好有，但如果遇不到合适的也不强求", tip:"觉察：稳定是加分项，不是你的硬性枷锁", score:{A:1,B:1}}
        ]
    },
    {
        q: "18. 回头看，过去你妥协做出的选择，大多时候？",
        opts: [
            {text:"虽然不完美，但帮你度过了难关", tip:"觉察：妥协的选择对你而言，是有效的缓冲保护", score:{A:2,B:0}},
            {text:"常常后悔，总觉得当初不该将就", tip:"觉察：你的妥协，最后大多会变成长久的遗憾", score:{A:0,B:2}},
            {text:"有好有坏，看当时的处境", tip:"觉察：没有固定模式，结果完全取决于外部环境", score:{A:1,B:1}}
        ]
    }
];

const resultSet = [
    {
        minA:24, minB:0, title:"【优先落地：先抓住一份工作，稳住基本盘】",
        content:`
<p>对你现阶段来说，最适合的选择，是先拿到一份可以落地的工作，优先解决生存、收入、身份的焦虑。</p>
<p>你对稳定的需求很强，缓冲试错的空间有限，长期待业会不断放大你的恐慌、自我怀疑，外界的评价也很容易压垮你。</p>
<p>这不代表你一辈子就要困在这份工作里，它是你的“安全跳板”：先用它获得现金流、职场履历，把你从悬空的焦虑状态里拉回地面。</p>
<p>⚠️ 重要提醒：入职之后，记得给自己设一个观察期限。如果这份工作持续重度消耗你，不要把“暂时过渡”变成永久妥协，保留继续寻找更好机会的通道。</p>
<p>适合行动：优先投递门槛匹配、能尽快上岗的岗位，把探索新方向放在下班后碎片化时间，不要裸辞、不要长时间脱产试错。</p>
`
    },
    {
        minA:0, minB:24, title:"【优先探索：你值得给自己一次重新选择的机会】",
        content:`
<p>你内心深处，很难接受用一份将就的工作，封印自己后面十几年的人生。勉强就业带来的压抑、不甘心，最后会变成漫长的精神内耗。</p>
<p>你有想要奔赴的方向，也具备承受试错代价的心理底气，比起缺钱的痛苦，你更害怕“从来没有为自己想要的东西尝试过”的遗憾。</p>
<p>但重新选择不等于盲目裸辞、盲目冲动。你需要做轻量化探索：低成本学习、副业试水、小规模验证方向，不要一次性押上全部筹码。</p>
<p>⚠️ 重要提醒：重新选择不是逃避就业，它是主动寻找适配自己的道路。如果你的经济缓冲时间很短，建议一边保留收入来源，一边慢慢验证新赛道。</p>
<p>适合行动：划定试错周期，制定清晰的验证标准，到时间拿到反馈再决定要不要全身心投入。</p>
`
    },
    {
        minA:10, minB:10, title:"【平衡摇摆：过渡式方案，是当下对你最好的答案】",
        content:`
<p>你现在处在非常典型的拉扯状态：一边需要收入和安全感，一边又不甘心随便将就，两个诉求都真实存在，没有对错。</p>
<p>对你来说，不用逼自己二选一，不必强行决定“我必须就业”或者“我必须转型”。最优解是【过渡模式】：找一份压力可控、不会完全吞噬你精力的过渡工作，保住基础收入，同时持续留出时间、精力探索你感兴趣的方向。</p>
<p>你最大的风险，是在无尽的纠结里原地停滞。一直反复思考、迟迟不行动，焦虑只会不断累积。</p>
<p>⚠️ 重要提醒：给两个方向都设置边界。过渡工作只用来保障生活，不要投入全部热情；新方向用低成本方式慢慢验证，不要幻想一步登天。</p>
<p>适合行动：找强度适中的过渡岗位，固定每周留出专属时间探索新方向，每3个月复盘一次状态，再决定后续重心偏向哪边。</p>
`
    }
];

let selectedCount = 0;
let scoreA = 0, scoreB = 0;
const quizBox = document.getElementById("quizBox");
const submitBtn = document.getElementById("submitBtn");
const resultBox = document.getElementById("resultBox");
const resultTitle = resultBox.querySelector(".result-title");
const resultContent = resultBox.querySelector(".result-content");

//渲染题目
questions.forEach((qItem, qIndex)=>{
    const wrap = document.createElement("div");
    wrap.className = "question-wrap";
    wrap.innerHTML = `<div class="q-title">${qItem.q}</div>`;
    qItem.opts.forEach((opt, oIdx)=>{
        const optDom = document.createElement("div");
        optDom.className = "option-item";
        optDom.innerText = opt.text;
        const tipDom = document.createElement("div");
        tipDom.className = "tip-text";
        wrap.appendChild(optDom);
        wrap.appendChild(tipDom);

        optDom.onclick = ()=>{
            //同题清除选中
            wrap.querySelectorAll(".option-item").forEach(d=>d.classList.remove("selected"));
            optDom.classList.add("selected");
            tipDom.innerText = opt.tip;
            //计分
            qItem.userScore = opt.score;
            selectedCount++;
            scoreA += opt.score.A;
            scoreB += opt.score.B;
            submitBtn.disabled = selectedCount < questions.length;
        }
    })
    quizBox.appendChild(wrap);
})

submitBtn.onclick = ()=>{
    quizBox.style.display = "none";
    submitBtn.style.display = "none";
    let res;
    if(scoreA >= scoreB + 6){
        res = resultSet[0];
    }else if(scoreB >= scoreA + 6){
        res = resultSet[1];
    }else{
        res = resultSet[2];
    }
    resultTitle.innerText = res.title;
    resultContent.innerHTML = res.content;
    resultBox.style.display = "block";
}
</script>
</body>
</html>
